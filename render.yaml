services:
  - type: web
    name: tokenbrief-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: EMBEDDING_MODEL_NAME
        value: all-MiniLM-L6-v2
      - key: GOOGLE_SCRIPT_URL
        value: https://script.google.com/macros/s/AKfycbxvk6GOKmypzQPoFy7FB2-J6F27rzehl2ymXSBTxbi1gOsernexe0emjlSHLHRPrEYBkQ/exec
      - key: GMAIL_SENDER_EMAIL
        value: connect.tushar0318@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
